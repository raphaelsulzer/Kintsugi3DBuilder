[project]
name = "kintsugi3d"
version = "0.1.0"
description = "Python bindings for the Kintsugi 3D Builder headless pipeline (import / specular fit / export) via JPype."
requires-python = ">=3.9"
dependencies = ["JPype1>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kintsugi3d"]
